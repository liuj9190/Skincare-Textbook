{
 question:"有機、植物來源的保養品，哪個說法比較正確？",
 options:["植物成分比較溫和，敏感肌可放心用", "植物也可能刺激肌膚，購買前先試用", "膚況不佳時，更適合改用有機植物保養品"],
 answer:1,
 stats:"天然、有機，不代表每個人都適用",
 explanation:"有些植物屬於藥草、效果強，皮膚容易粗糙的人，在膚況不佳時使用可能太過刺激。購買前先試用，確認不會過敏再買。",
 category:"成分判斷"
}
];

let index = 0;
let correctCount = 0;
let wrongQuestions = [];

const appEl = document.getElementById("app");
const progressText = document.getElementById("progress-text");
const progressFill = document.getElementById("progress-fill");
const questionEl = document.getElementById("question");
const optionsEl = document.getElementById("options");
const feedback = document.getElementById("feedback");
const statsEl = document.getElementById("stats");
const explanationEl = document.getElementById("explanation");
const nextBtn = document.getElementById("next");

function scrollAppToTop(){
  appEl.scrollTo({top:0, behavior:"smooth"});
}

function loadQuestion(){
  const q = questions[index];

  progressText.textContent = `第 ${index+1} / ${questions.length} 題`;
  progressFill.style.width = `${(index / questions.length) * 100}%`;

  questionEl.textContent = q.question;
  optionsEl.innerHTML = "";
  feedback.textContent = "";
  statsEl.textContent = "";
  explanationEl.textContent = "";
  nextBtn.style.display = "none";

  const order = q.options.map((_, i) => i);
  for(let i = order.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [order[i], order[j]] = [order[j], order[i]];
  }
  order.forEach(orig => {
    const btn = document.createElement("button");
    btn.className = "option";
    btn.textContent = q.options[orig];
    btn.dataset.idx = orig;
    btn.onclick = () => checkAnswer(btn, orig, q);
    optionsEl.appendChild(btn);
  });

  nextBtn.textContent = index === questions.length - 1 ? "看結果 ➜" : "再來一題 ➜";
  scrollAppToTop();
}

function checkAnswer(btn, selected, q){
  document.querySelectorAll(".option").forEach(b => {
    const i = Number(b.dataset.idx);
    b.disabled = true;
    if(i === q.answer) b.classList.add("correct-border");
    if(i === selected && selected !== q.answer) b.classList.add("wrong-border");
  });

  setTimeout(() => {
    if(selected === q.answer){
      feedback.textContent = "✔ 答對了！";
      feedback.className = "correct";
      correctCount++;
    }else{
      feedback.textContent = "✘ 答錯了！";
      feedback.className = "incorrect";
      if(!wrongQuestions.includes(index)) wrongQuestions.push(index);
    }

    statsEl.textContent = `💡 ${q.stats}`;
    explanationEl.textContent = q.explanation;
    nextBtn.style.display = "inline-block";
    progressFill.style.width = `${((index + 1) / questions.length) * 100}%`;
  }, 400);
}

nextBtn.onclick = () => {
  index++;
  if(index < questions.length){
    loadQuestion();
  }else{
    showFinish();
  }
};

function getResultType(score, total){
  const ratio = score / total;

  if(ratio === 1) return {
    type:"保養盲點零紀錄",
    verdict:"5 題全對，你的日常保養觀念很扎實。接下來可以更進一步，學會依膚質與成分挑選適合自己的產品。"
  };
  if(ratio >= 0.8) return {
    type:"差一點就滿分",
    verdict:"你掌握了大部分重點，剛剛答錯的那一題，值得再確認一下。"
  };
  if(ratio >= 0.6) return {
    type:"踩到幾顆保養地雷",
    verdict:"你已經有一些正確觀念，剛剛錯的幾題，是不少人容易忽略的細節，也可能正是保養卡關的原因。"
  };
  return {
    type:"保養盲點多多",
    verdict:"別擔心，保養知識本來就很多。先弄懂基本原則，再決定自己需要什麼，會更有效率。"
  };
}

function getDiagnosis(wrongList){
  if(wrongList.length === 0){
    return {
      type:"沒有明顯盲點",
      desc:"你對防曬、保養手法、飲食與成分判斷，都已有基本掌握。",
      isPerfect:true
    };
  }

  const categories = wrongList.map(i => questions[i].category);
  const unique = [...new Set(categories)];

  // 防曬觀念相關（第 1、2 題）
  if(unique.length === 1 && unique[0] === "防曬觀念"){
    return {
      type:"防曬觀念",
      desc:"你這次漏掉的重點，都和紫外線防護有關。UVA 與 UVB 的差異、SPF 與 PA 的分工，是最常見、卻最容易被忽略的一塊。"
    };
  }

  // 單一盲點
  if(unique.length === 1){
    const map = {
      "保養手法":"保養手法",
      "飲食與肌膚":"飲食與肌膚的關係",
      "成分判斷":"成分判斷"
    };
    const descMap = {
      "保養手法":"你這次漏掉的重點，和保養手法有關。用力搓揉、強行按摩反而有反效果，拉扯會破壞真皮、造成鬆弛。真正該做的是輕柔對待。",
      "飲食與肌膚的關係":"你這次漏掉的重點，和飲食與肌膚的關係有關。蛋白質、碳水化合物、脂質這三大營養素，各自在肌膚健康中扮演角色，只吃蔬菜是不夠的。",
      "成分判斷":"你這次漏掉的重點，和成分判斷有關。有些植物屬於藥草、效果強，皮膚容易粗糙的人在膚況不佳時可能過於刺激，購買前先試用最保險。"
    };
    const t = map[unique[0]] || unique[0];
    return {
      type:t,
      desc:descMap[t] || "你這次漏掉的重點，集中在同一個面向，這是你的保養觀念裡比較容易被忽略的一塊。"
    };
  }

  // 多個盲點
  return {
    type:"多個面向",
    desc:`你這次漏掉的重點，橫跨 ${unique.join("、")}。這代表你的保養觀念不是全錯，而是有幾個不同面向的細節還沒有串起來。與其一個一個補，不如先把基本原則整理一遍。`
  };
}

let finishStep = 0;
let finishResult = null;
let finishDiagnosis = null;

function showFinish(){
  finishResult = getResultType(correctCount, questions.length);
  finishDiagnosis = getDiagnosis(wrongQuestions);
  finishStep = 0;
  renderFinishStep();
}

function renderFinishStep(){
  const result = finishResult;
  const diagnosis = finishDiagnosis;
  const shareText = `我的保養測驗結果是「${result.type}」，答對 ${correctCount}/${questions.length} 題，你呢？`;
  const pitchHTML = correctCount === questions.length
    ? "基礎觀念你都掌握了。下一步，是依自己的膚質選對產品，再搭配飲食與生活型態。"
    : "有盲點很正常。與其繼續買錯保養品，不如先弄懂自己的肌膚需要什麼。";

  if(finishStep === 0){
    let diagHTML = "";
    const topicMap = {
      "防曬觀念":"UV 隔離、防曬與彩妝",
      "保養手法":"對抗老化的按摩方式",
      "飲食與肌膚":"對肌膚好的食物",
      "成分判斷":"學會閱讀商品標示"
    };
    const topics = [...new Set(wrongQuestions.map(i => questions[i].category))]
      .map(c => topicMap[c]).filter(Boolean);

    if(diagnosis.isPerfect){
      diagHTML = `<p class="perfect">✔ ${diagnosis.desc}</p>`;
    }else{
      diagHTML = `
        <div class="diag-type">你的保養盲點：${diagnosis.type}</div>
        <p>${diagnosis.desc}</p>
        ${topics.length ? `<p class="diag-topic">📖 書中有對應的主題：${topics.map(t => `「${t}」`).join("、")}</p>` : ""}
      `;
    }

    appEl.innerHTML = `
      <div id="finish">
        <div class="finish-step">
          <div class="result-card">
            <h2>🧴 你的保養測驗結果</h2>
            <div class="result-type">${result.type}</div>
            <div class="result-score">${correctCount}<span> / ${questions.length} 題答對</span></div>
            <p class="result-verdict">${result.verdict}</p>
            <div class="diagnosis">
              <h3>🔍 盲點診斷</h3>
              ${diagHTML}
            </div>
          </div>
          <div class="book-ask">
            <h3>保養的疑問，不只這 5 題</h3>
            <ul>
              <li>臉怎麼洗才乾淨？</li>
              <li>沒有上妝，也需要卸妝嗎？</li>
              <li>如何讓保養品真正有效？</li>
            </ul>
            <p class="ask-end">這些答案，都整理在書裡。</p>
          </div>
          <button class="step-next" id="step-next">答案在書裡，看看這本書 ➜</button>
        </div>
      </div>
    `;
  }

  if(finishStep === 1){
    appEl.innerHTML = `
      <div id="finish">
        <div class="finish-step">
          <div class="book-hero">
            <div class="eyebrow">— 想把日常保養觀念弄清楚？—</div>
            <a href="${BOOK_URL}" target="_blank" rel="noopener">
              <img id="book-cover" src="book1.jpg" alt="《皮膚照護教科書〔經典暢銷版〕》書籍封面">
            </a>
            <p class="book-title">《皮膚照護教科書》</p>
            <p class="book-subtitle">乾燥、暗沉、毛孔、粉刺、老化、鬆弛……男生女生的肌膚問題，都能在書裡找到解答。</p>
            <div class="book-badges">
              <span>暢銷十年</span>
              <span>日本亞馬遜讀者五星好評</span>
              <span>全彩圖解</span>
            </div>
          </div>

          <div class="book-pitch">
            <p>${pitchHTML}</p>
          </div>

          <p class="source-line">測驗內容整理自本書，作者為皮膚科醫師高瀬聰子、預防醫學諮詢專家細川桃。</p>

          <div class="store-links">
            <a href="https://www.books.com.tw/products/0011066867?sloc=main" target="_blank" rel="noopener"><img src="22.jpg" alt="博客來"></a>
            <a href="https://www.eslite.com/product/10012168942683254066008" target="_blank" rel="noopener"><img src="23.jpg" alt="誠品線上"></a>
            <a href="https://shopee.tw/%E7%9A%AE%E8%86%9A%E7%85%A7%E8%AD%B7%E6%95%99%E7%A7%91%E6%9B%B8%E3%80%94%E7%B6%93%E5%85%B8%E6%9A%A2%E9%8A%B7%E7%89%88%E3%80%95-%E2%98%85%E6%9A%A2%E9%8A%B7%E5%8D%81%E5%B9%B4%EF%BC%81%E4%B8%8D%E6%95%97%E7%9A%AE%E8%86%9A%E4%BF%9D%E9%A4%8A%E7%B6%93%E5%85%B8%E5%86%8D%E6%AC%A1%E5%9B%9E%E6%AD%B8%E2%98%85-i.88634813.44819991204" target="_blank" rel="noopener"><img src="24.jpg" alt="蝦皮購物"></a>
            <a href="${BOOK_URL}" target="_blank" rel="noopener"><img src="25.jpg" alt="星出版官網"></a>
          </div>

          <div class="share-actions">
            <button class="share-btn" id="share-btn">📤 分享給朋友</button>
            <button class="share-btn secondary" id="restart-btn">🔄 再玩一次</button>
          </div>
        </div>
      </div>
    `;

    document.getElementById("share-btn").onclick = async () => {
      // 只分享乾淨網址（去掉 utm 等參數）
      const url = window.location.origin + window.location.pathname;
      const fullText = `${shareText} ${url}`;
      if(navigator.share){
        try{
          await navigator.share({ title: document.title, text: shareText, url });
          return;
        }catch(e){
          if(e && e.name === "AbortError") return;
        }
      }
      try{
        await navigator.clipboard.writeText(fullText);
        showToast("已複製連結，貼給朋友吧！");
      }catch(e){
        const ta = document.createElement("textarea");
        ta.value = fullText;
        ta.style.position = "fixed";
        ta.style.opacity = "0";
        document.body.appendChild(ta);
        ta.select();
        try{
          document.execCommand("copy");
          showToast("已複製連結，貼給朋友吧！");
        }catch(err){
          prompt("複製這段文字分享給朋友：", fullText);
        }
        document.body.removeChild(ta);
      }
    };

    document.getElementById("restart-btn").onclick = () => {
      index = 0;
      correctCount = 0;
      wrongQuestions = [];
      finishStep = 0;
      location.reload();
    };
  }

  const stepNext = document.getElementById("step-next");
  if(stepNext){
    stepNext.onclick = () => {
      finishStep++;
      renderFinishStep();
      scrollAppToTop();
    };
  }

  scrollAppToTop();
}

function showToast(msg){
  const t = document.getElementById("copy-toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 1800);
}

loadQuestion();
</script>
</body>
</html>
